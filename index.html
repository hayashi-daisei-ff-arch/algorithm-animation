<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>データ構造と探索｜操作で確かめる教材</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./engine.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">コンピュータ演習</p><h1>データ構造と探索</h1><p class="intro">データの持ち方と，探し方を一つずつ確かめます．</p></div>
    <button id="projection" class="quiet" aria-pressed="false">投影表示</button>
  </header>
  <main>
    <nav role="tablist" aria-label="教材の切り替え">
      <div class="nav-row"><span class="nav-label">データ構造</span><div class="tabs" id="structure-tabs"></div></div>
      <div class="nav-row"><span class="nav-label">探索</span><div class="tabs" id="search-tabs"></div></div>
    </nav>
    <section id="lesson" role="tabpanel" aria-labelledby="tab-array">
      <div class="lesson-heading"><div><p id="section-label" class="eyebrow"></p><h2 id="lesson-title"></h2></div><p id="counter" class="counter"></p></div>
      <p id="description" class="description"></p>
      <form id="settings" novalidate></form>
      <p id="error" class="error" role="alert"></p>
      <div id="stage" class="stage" aria-label="データ構造のアニメーション"></div>
      <div class="legend" aria-label="図の凡例"><span><i class="key current"></i>現在の対象</span><span><i class="key visited"></i>確認済み</span><span><i class="key found"></i>発見・操作対象</span><span><i class="key excluded"></i>探索対象外</span></div>
      <div class="step-description"><span id="step-label"></span><p id="message" role="status" aria-live="polite"></p></div>
      <div id="auxiliary" class="auxiliary"></div>
      <div class="playback">
        <div class="buttons"><button type="button" id="reset" class="quiet">最初へ</button><button type="button" id="previous" class="quiet">戻る</button><button type="button" id="play" class="primary">自動再生</button><button type="button" id="next" class="primary">次へ</button></div>
        <label class="speed-label">間隔<select id="speed"><option value="1800">ゆっくり</option><option value="1100" selected>標準</option><option value="550">速い</option></select></label>
        <label class="timeline-label">表示位置<input type="range" min="0" max="1" value="0" id="timeline" aria-label="表示する手順"></label>
      </div>
      <aside class="notes"><h3>確認すること</h3><div id="notes"></div></aside>
    </section>
    <footer>「次へ」で1操作ずつ進めます．入力を変えたら「設定を反映」を押してください．</footer>
  </main>
</body>
</html>
